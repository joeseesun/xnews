# Included at http scope by the existing aaPanel Nginx configuration.
map $uri $xnews_route_cache {
    default "public, max-age=60, stale-while-revalidate=300";
    ~^/(static|read|media)/ "public, max-age=31536000, immutable";
    ~^/a/ "public, max-age=300, stale-while-revalidate=3600";
    /feed.xml "public, max-age=300, stale-while-revalidate=600";
    /robots.txt "public, max-age=300";
    /sitemap.xml "public, max-age=300";
}
map $status $xnews_cache {
    default $xnews_route_cache;
    404 "no-store";
}
map $uri $xnews_robots {
    default "";
    ~^/read/ "noindex";
    /404.html "noindex";
}
server {
    listen 80;
    server_name xnews.qiaomu.ai;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/xnews.qiaomu.ai;
        try_files $uri =404;
    }
    location / { return 301 https://xnews.qiaomu.ai$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name xnews.qiaomu.ai;
    root /opt/qiaomu-apps/xnews/current;
    index index.html;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/xnews.qiaomu.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xnews.qiaomu.ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    etag on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control $xnews_cache always;
    add_header X-Robots-Tag $xnews_robots always;
    add_header X-XNews-Release $xnews_release always;
    include /opt/qiaomu-apps/xnews/release.nginx.conf;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /_headers { return 404; }
    location ~ /\. { return 404; }
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
    access_log /www/wwwlogs/xnews.qiaomu.ai.log;
    error_log /www/wwwlogs/xnews.qiaomu.ai.error.log;
}
